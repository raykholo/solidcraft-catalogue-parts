name: generator
# On a pull request: the vendors/<vendor>/<series>/<generator>/ folders it touches (all of them when runtime/, schema/ or tools/ change).
# On a push to main, or by hand: every generator. Cheap whole-tree checks (provenance, lint, index, packages) always run on everything.
on:
  pull_request:
    paths: ["vendors/**", "runtime/**", "schema/**", "tools/**", "packages/**", "docs/generator-package.md", ".github/workflows/generator.yml"]
  push:
    branches: [main]
    paths: ["vendors/**", "runtime/**", "schema/**", "tools/**", "packages/**", "docs/generator-package.md", ".github/workflows/generator.yml"]
  workflow_dispatch:
concurrency:
  group: generator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: spec check (SC ${{ matrix.sc_ver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sc_ver: ["0.50.0", "0.51.1"]
    env:
      SC_VER: ${{ matrix.sc_ver }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: SolidCraft CLI
        # the official release tarball for $SC_VER (bin/solidcraft-cli inside)
        run: |
          gh release download "v${SC_VER}" --repo tangency-labs/solidcraft --pattern "solidcraft-${SC_VER}-linux-x86_64.tar.gz" --dir "$RUNNER_TEMP/sc"
          tar -xzf "$RUNNER_TEMP/sc/solidcraft-${SC_VER}-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/sc"
          echo "SC_CLI=$RUNNER_TEMP/sc/solidcraft-${SC_VER}-linux-x86_64/bin/solidcraft-cli" >> "$GITHUB_ENV"
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Changed generators
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "dirs=" >> "$GITHUB_OUTPUT"; exit 0; fi
          base=$(git merge-base origin/${{ github.base_ref }} HEAD)
          if git diff --name-only "$base" HEAD | grep -qE '^(runtime|schema|tools)/|^\.github/workflows/generator\.yml$'; then dirs=$(ls -d vendors/*/*/*/); else
            dirs=$(git diff --name-only "$base" HEAD | grep -E '^vendors/[^/]+/[^/]+/[^/]+/' | cut -d/ -f1-4 | sort -u); fi
          echo "dirs=$(echo $dirs)" >> "$GITHUB_OUTPUT"
      - name: Version bump (a pull request that changes a generator's files raises its generator.toml version)
        if: github.event_name == 'pull_request'
        run: tools/versions check "origin/${{ github.base_ref }}"
      - run: tools/check ${{ steps.changed.outputs.dirs }}
      - name: Spec check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-checks-sc-${{ matrix.sc_ver }}
          path: vendors/*/*/*/checks/${{ matrix.sc_ver }}/
          if-no-files-found: error
      - run: tools/provenance --check
      - run: tools/lint
      - run: tools/build-index --check
      # Generator packages (docs/generator-package.md): the committed packages must be what tools/export-package writes, and each must give the
      # Python generator's commands for every code (no SolidCraft needed); changed generators that have a package are also built both ways.
      - run: tools/export-package --check
      - run: tools/package-equiv
      - name: Package build equivalence (changed generators that have a package)
        run: |
          dirs="${{ steps.changed.outputs.dirs }}"
          [ -n "$dirs" ] || dirs=$(ls -d vendors/*/*/*/)
          with_pkg=""
          for d in $dirs; do
            id=$(echo "$d" | cut -d/ -f2-4 | tr / -)
            [ -f "packages/$id.generator.json" ] && with_pkg="$with_pkg $d"
          done
          if [ -n "$with_pkg" ]; then tools/package-equiv --build $with_pkg; else echo "no changed generator has a package"; fi
