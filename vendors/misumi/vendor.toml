notes = "Not affiliated with or endorsed by the manufacturer; the name is used only to say what the parts are. Public catalogue pages only: the FA catalogue (2014 edition pages for aluminium extrusions, tapping, wrench access holes, insertion nuts) and the Economy Series catalogue 2025 (linear shafts; ASEAN edition, E- prefix codes, which may not be sold in every region: the US site lists the standard non-E series instead). MISUMI's CAD terms of use do not clearly allow analysing downloaded CAD, so nothing here is compared against it. No CAD downloads, logos or photos in this repository."
