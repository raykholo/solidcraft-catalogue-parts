verdict = "corrected"
note = "Square flange: the authors' reading (H the side before cutting, K the remaining straight edge, extent (H+K)/sqrt 2) contradicts the page. p.538 draws H horizontally, tip to tip of the cut corners, and K along an edge; on p.534 the drawn H equals the tip-to-tip extent (measured on the image: H/P = 1.4 = 28/20) and K is the side of the square. Now K = side of the square, H = extent across the cut corners (corner flats at +-H/2). The old flange was about 25% too large, and larger than the round flange of the same H. Code (src/support.py, src/check.py) and texts changed; the numbers in dims.csv and slit.csv are unchanged."

