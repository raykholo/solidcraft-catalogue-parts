format = "solidcraft-generator/2"
id = "dowel-flanged-shaft-support"
name = "MISUMI Economy dowel flanged shaft support"
license = "CC0-1.0"
model = "dowel-flanged-shaft-support.sc"

[parameters]
raw = { type = "text", min = 1, max = 128, escape = "[ -~]" }
d = { type = "int", min = 0, max = 999999 }
type = { type = "text", min = 1, max = 12, escape = "[A-Za-z]" }

[[template]]
pattern = 'E-[S:stainless]STHW{shape: R=round, C=compact}[B:black]K{d}'

[[template]]
pattern = 'E-{type}{d}'

[[template]]
pattern = '{raw}'

