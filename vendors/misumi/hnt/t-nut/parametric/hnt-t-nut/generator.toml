format = "solidcraft-generator/2"
id = "hnt-t-nut"
name = "MISUMI 5 series pre-assembly T-nuts (HNTT family)"
license = "CC0-1.0"
model = "hnt-t-nut.sc"

[parameters]
raw = { type = "text", min = 1, max = 128, escape = "[A-Za-z0-9._ /-]" }
type = { type = "text", default = "HNTT5", min = 3, max = 9, escape = "[A-Za-z0-9]" }
m = { type = "text", default = "5", min = 1, max = 5, escape = "[0-9.]" }

[[template]]
pattern = '{type}[\-{m}]'

# a catch-all behind it, so that the script gives the Python 'expected ...' refusal for a code that is not a code
[[template]]
pattern = '{raw}'

[rows."HNTT5-3"]
source = "MISUMI FA catalogue S9 (sources.toml), p.559"
page = "p.559 table"
status = "verified"
note = "tap drill derived (ISO coarse), edge rounds and flank measured: see the generator README, not guaranteed"

