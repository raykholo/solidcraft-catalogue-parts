id = "misumi.hnt.t-nut"
name = "MISUMI 5 series pre-assembly T-nuts (HNTT family)"
version = "0.1.3"
kind = "generator"
min_host_version = "0.49.1"
preview_code = "HNTT5-4"

# Parametric construction: one permanent Nut seed; variant-local joins, bores and threads.
[entry]
build  = "nut:parse_build"
check  = "check:check"
shots  = "shots"

[declares]
labels   = ["T-nut", "Insertion nut", "Slot nut", "Pre-assembly nut", "HNTT"]
keywords = ["slot nut", "drop-in nut", "extrusion nut", "M5 nut", "6 mm slot"]
vendor   = "MISUMI"

[[declares.matches]]
id         = "hnt-tnut"
generator  = "t-nut"
pattern    = '^HNT(?:T|TV|TZ|TSN|TSS)5(?:-(?P<m>\d+(?:\.\d)?))?$'
flags      = "i"
confidence = "exact"
params     = { thread = "M{m}" }
examples          = ["HNTT5-4", "HNTT5", "HNTTSN5-3", "HNTTV5-5", "HNTTSS5-5"]
negative_examples = ["HNTT", "HNTU5", "HNTT6-4", "HNTT5-"]

[inputs]
type = { choices = ["HNTT5", "HNTTV5", "HNTTZ5", "HNTTSN5", "HNTTSS5"] }
thread = { choices = ["M3", "M4", "M5"] }

[guarantee]
not_guaranteed = ["The flank from the 5.8 mm bottom to the 10 mm body (measured from the vector side view, about 35 degrees from the nut axis)", "The edge rounds of the side view (R0.3, R1.0 reduced on the E 3.3 types, R0.2; none is dimensioned on the page)", "The tap drill (pilot bore O2.5 / O3.3 / O4.2 for M3 / M4 / M5) is the ISO coarse one: the page prints none; the thread is cosmetic (solid.thread) through the thickness T"]
