id = "misumi.hfs.extrusion"
name = "MISUMI aluminium extrusions, 5 series 2020 / 2040 / 4040 and 6 series 3030"
version = "0.2.0"
kind = "generator"
min_host_version = "0.49.1"
preview_code = "HFS5-2020-120-LTP-RTP-LCH"

[entry]
build  = "ext:parse_build"
check  = "check:check"
shots  = "shots"

[declares]
labels   = ["Aluminium extrusion", "T-slot profile", "Aluminum profile", "HFS5", "HFS6", "2020", "4040"]
keywords = ["slot profile", "extrusion", "aluminium frame", "MISUMI 5 series", "MISUMI 6 series", "end tapping", "wrench access hole"]
vendor   = "MISUMI"

[[declares.matches]]
id         = "hfs5"
generator  = "extrusion"
pattern    = '^K?(?:NFS|NFSB|HFS|HFSB|CAF|HFSY)5-(?P<profile>2020|2040|4040)-(?P<length>\d+(?:\.\d+)?)(?P<alterations>(?:-[A-Z0-9]+)*)$'
flags      = "i"
confidence = "exact"
params     = { profile = "{profile}", length_mm = "{length}" }
examples          = ["HFS5-2020-120-LTP-RTP-LCH", "KHFS5-2040-1000", "NFSB5-4040-250", "HFS5-2020-497.5-TPW-LEV-REH"]
negative_examples = ["HFS5-2020", "HFS5-3030-100", "HFS6-2020-100", "MGN12H2R300Z0C"]

[[declares.matches]]
id         = "hfs6"
generator  = "extrusion"
pattern    = '^K?(?:HFS|HFSB|CAF|HFSY)6-(?P<profile>3030)-(?P<length>\d+(?:\.\d+)?)(?P<alterations>(?:-[A-Z0-9]+)*)$'
flags      = "i"
confidence = "exact"
params     = { profile = "{profile}", length_mm = "{length}" }
examples          = ["HFS6-3030-500-LCH-X5-TPW", "KHFS6-3030-1000", "HFSB6-3030-120-LTP-RTP-RWV-X8"]
negative_examples = ["HFS6-3030", "HFS6-6060-100", "HFS5-3030-100"]

[inputs]
type = { choices = ["NFS5", "NFSB5", "HFS5", "HFSB5", "CAF5", "HFSY5", "HFS6", "HFSB6", "CAF6", "HFSY6"] }
profile = { choices = ["2020", "2040", "4040", "3030"] }
length_mm = { min = 50, max = 4000 }

[guarantee]
not_guaranteed = ["Section values read from the vector drawing rather than printed: lip thickness on the 5 series, where the cavity wall ends and the floor half width (measured to 0.01 mm; on the 3030 the wall end 5.31 follows from the 45 degree flank closing on the printed numbers); the lip-tip round R0.3 (the pages show a tip round but do not size it)", "The central voids of the 2040 / 4040 (measured) and the 4040 bore-block inner-corner notch (3.6 mm square, fitted so that the section area meets the printed 472 mm2; the drawing shows 3.0 to 3.4): with them the section matches the printed area within 0.3 % and Ix / Iy within 1 % (sources.toml rows 1900-1904)", "Wrench access hole depth (through the whole section) and, on 2040 / 4040 / 3030, the H / V axis convention", "The cosmetic M5 / M8 end thread on the bore (its length and the effect of a wrench hole cutting the bore)", "FL / FR on the 5 series (the catalogue table lists the 6 and 8 series only)"]
