[[row]]
id = 1904
verdict = "corrected"
note = "Re-derived: area band 0.3 % = 0.549 mm2 on 183, above half a unit (0.5), larger for every profile; moments 1 %; mass half a unit (0.05 for 0.5 and 0.9, 0.005 for 0.88 and 1.28); src/check.py really tests all of these (max(0.003 pa, 0.5), 0.01 p for each sorted moment, half = 0.05 or 0.005, plus the polar moment from SolidCraft's tensor) and the 0.50.0 check files show them PASS. Corrected: the density sentence said 2.71 is the mean of the four implied densities; the mean is 2.716 (2.732, 2.716, 2.712, 2.703). Text now says 2.71 lies inside the spread; the half-unit mass band makes the choice immaterial. profiles.expected_moments spot-checked independently: my own shapely build (outline minus slots, R1 corners, lip-tip spandrels, voids, bores; exact polygon moments) gives 2020 182.83 / 7430, 2040 323.75 / 51344 / 13551, 3030 333.14 / 28452, 4040 472.39 / 88653 against the code's 182.83 / 7430, 323.75 / 51344 / 13551, 333.14 / 28453, 472.43 / 88658. Coarse hand check of 2020 (square 20^4/12 = 13333, minus 4 slots of area about 50.6 mm2 with centroid 6.84 from the axis plus their own moment about 500 each, minus the bore 15 and corner round-offs 82): about 7500, within 1 % of 7430."

[[row]]
id = 1905
verdict = "agree"
note = "Convention re-read: p.757 prints 'the number of pilot hole for tapping in the end' and 'Heli-coil is inserted into the pilot holes', with M5 Depth 15 and M8 Depth 24 in the table (3030 one hole). The pilot diameters are the printed bores O4.2 (p.529-530) and O6.8 (p.571); that these are the ISO tap drills of M5 (5 - 0.8) and M8 (8 - 1.25) is standard arithmetic, labelled derived, not read from p.757. ext.py cuts no nominal diameter, only a cosmetic solid.thread on the printed bore; check.py tests bore diameter, designation and depth; 0.50.0 checks PASS (e.g. 'tapped bore ... = printed pilot bore 4.2', 'tap L depth 15')."
