amended = "2026-11-27, coordinator: row 19 corrected after the re-read. The reviewer noted p.530 prints A6063SS-T5 for NFS while the data had A6063S-T5 for every profile; the page text shows p.529 (2020) prints A6063S-T5 and p.530 (2040, 4040) prints A6063SS-T5. types.csv now carries the grade per profile (new column profiles) and ext.py looks it up by (type, profile); NFS5-2040-300 added to codes.txt; tools/check passes. Previous hash: sha256:100ab05ff352da0556bb40efde5342f4fec14e22a08fbb2d8d9ea3447d450a96"
method = "Downloaded the five cited MISUMI 2014 FA catalogue PDFs, rendered the pages at 300 dpi and re-read every labelled and published value cell by cell. Re-measured the measured rows from the PDF vector paths (page.get_drawings(): 2020, 2040, 4040 and 3030 section outlines, scaled on the labelled overall size). Checked the codes.txt reject cases against the catalogue text (length range, K lengths, X5/X8, ZZZ). No vendor CAD was used. No value needed correcting."

