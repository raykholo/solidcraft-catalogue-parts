[[dimension]]
id = 1904
item = "Tolerance of the section-property check (area, mass, Ix / Iy)"
value = "area: 0.3 % of the printed value, never below 0.5 mm2; Ix, Iy: 1 %; mass: half a unit of the last printed digit"
source = ["S22", "S23"]
source_text = "S22 p.529-530, S23 p.571 tables"
page = "tables of rows 1900-1903"
status = "derived"
note = "The tables round: area to 3 figures (183 stands for 182.5 to 183.5, 0.27 %), moments to 3 figures (0.742 = 7415 to 7425), mass to 1 or 2 decimals. The area band 0.3 % is therefore at the printed precision, and the check uses the larger of 0.3 % and half a unit (0.5 mm2: 0.3 % is the larger for every profile here). The 1 % moment band absorbs the 3-figure rounding and the approximate tip round R0.3 (about 0.1 %). Mass is compared as area x 2.71 g/cm3 (aluminium extrusion alloy density: A6063 / A6N01 are 2.69 to 2.72; the catalogue prints no density; the four printed pairs imply 2.73 / 2.72 / 2.71 / 2.70, mean 2.716, and 2.71 lies inside that spread; the half-unit mass band is far wider than the 0.2 % between 2.71 and 2.716) and only to half a unit of the printed digit (0.05 or 0.005 kg/m). SolidCraft's inertia tensor of the plain bar gives the polar moment Ix + Iy (I_xx / (rho L), planar faces exact) and is checked against the sum of the printed moments; Ix and Iy separately cannot be read from the tensor of a long bar (the A L^2 / 12 term is 10^3 times larger), so they are computed from the profile geometry in check.py (profiles.expected_moments: outline, voids, bores, and the corner and lip-tip round-offs)"

[[dimension]]
id = 1905
item = "Tapped end holes: what is modelled (tap drill and nominal thread)"
value = "the printed pilot bore (5 series O4.2, 3030 O6.8) is the modelled hole; a cosmetic thread of the catalogue's nominal size (M5 depth 15, M8 depth 24) is laid on it"
source = ["S2", "S1", "S10"]
source_text = "S2 p.757 tapping table (M5 Depth 15, M8 Depth 24; note: \"the number of pilot hole for tapping in the end\", \"Heli-coil is inserted into the pilot holes\"); S1 p.529-530 \"O4.2\", S10 p.571 \"O6.8\""
page = "p.757 table and notes; p.529, p.530, p.571 drawings"
status = "derived"
note = "The catalogue calls the profile bores pilot holes for end tapping: O4.2 is the ISO tap drill of M5 (5 - 0.8) and O6.8 that of M8 (8 - 1.25, rounded to the drill 6.8). Convention used (same as SolidCraft's own tapped hole, solid.hole with thread, which takes the tap drill): the geometry is the printed pilot bore, never the nominal diameter; the thread is cosmetic (solid.thread, extent length, listed by model.threads) with the nominal designation and the catalogue depth, starting at the end face. check.py checks that the cylinder carrying each thread has the printed pilot diameter, that the thread designation is the catalogue's and that its depth is the printed depth (interrupted only by a wrench hole). The four O4.2 corner holes of the 3030 are not tapped (one tapped hole per end, p.757). Heli-coil LHP / RHP / HPW (M3 depth 6) are not modelled"

