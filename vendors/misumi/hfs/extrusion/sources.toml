# Where every number of this generator comes from. One [[source]] per vendor document, one [[dimension]] per cited item.
# status: labelled / published = printed in the catalogue; measured = read from the vertex coordinates of the published vector
# drawing; derived = computed from labelled numbers; approximate = an estimate (appearance or an illustration choice); none.
# source = [] is allowed only for approximate / none rows.

[meta]
clean_room = "Clean-room: only public catalogue pages and PDFs from the manufacturers' own sites. No vendor CAD (STEP/IGES/...) was downloaded or used, no other CAD program or generator was consulted. Where a value is not printed as a number, the table says how it was obtained. current web catalogue may differ; see \"Open questions\" in README.md."
edition_note = "Catalogue edition: the MISUMI PDFs below are the 2014 FA catalogue, \"2nd\" edition pages (P.529, 755-760). The"

