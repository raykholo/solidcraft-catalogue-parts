id = "misumi.sfj.shaft"
name = "MISUMI Economy Series linear shafts (E- prefix, ASEAN catalogue 2025; g7 / f8): plain, tapped, stepped, with wrench flats and flat surfaces"
version = "0.3.0"
kind = "generator"
min_host_version = "0.49.1"
preview_code = "E-PSFJ6-20"

[entry]
build  = "shaft:parse_build"
check  = "check:check"
shots  = "shots"

[declares]
labels   = ["Linear shaft", "Shaft", "Precision shaft", "E-SFJ", "E-PSFJ"]
keywords = ["round shaft", "hard chrome plated shaft", "stainless shaft", "tapped shaft", "both ends tapped shaft", "stepped shaft", "wrench flat", "wrench slot"]
vendor   = "MISUMI"

[[declares.matches]]
id         = "sfj-shaft"
generator  = "shaft"
pattern    = '^E-(?:(?:PSSFJ|PSFJ|PSFG|SSFJ|SFJ)[TCZW]?|(?:PSSFPG|PSFPG|SSFPG|SFPG|PSSFPH|PSFPH|SSFPH|SFPH|PFPGH))(?P<d>\d{1,2})-(?P<length>\d+(?:\.\d+)?)(?P<options>(?:-[A-Z0-9.]+)*)$'
flags      = "i"
confidence = "exact"
params     = { diameter_mm = "{d}", length_mm = "{length}" }
examples          = ["E-PSFJ6-20", "E-SSFJ10-123.4-LKC-WSC12-X8", "E-PSFJT50-200-M30", "E-PSFG16-250-FC20-A10", "E-PSFJC6-40-M3-SC0", "E-PSFJZ6-50-M3-N3-SC0", "E-PSFJW6-50-M3-N3", "E-PSFPG8-200-F4-P6-M3-SC0", "E-PSFPH8-200-F5-P6-M3-T5-SC0", "E-PFPGH30-800-F30-P20-M16-T25-SC40"]
negative_examples = ["E-SFJ", "E-SFJ20", "E-XYZ20-300", "E-SFJ20-", "E-PSFJX6-20", "E-PFPG8-200", "E-SFPK8-200-F4-P6-M3-SC0"]

[inputs]
type = { choices = ["E-SFJ", "E-SSFJ", "E-PSFJ", "E-PSSFJ", "E-PSFG", "E-SFJC", "E-SSFJC", "E-PSFJC", "E-PSSFJC", "E-PSFGC", "E-SFJZ", "E-SSFJZ", "E-PSFJZ", "E-PSSFJZ", "E-PSFGZ", "E-SFJW", "E-SSFJW", "E-PSFJW", "E-PSSFJW", "E-PSFGW", "E-SFPG", "E-SSFPG", "E-PSFPG", "E-PSSFPG", "E-SFPH", "E-SSFPH", "E-PSFPH", "E-PSSFPH", "E-PFPGH"] }
diameter_mm = { min = 3, max = 50 }
length_mm = { min = 10, max = 1500 }

[guarantee]
not_guaranteed = ["The shaft is a plain cylinder at its nominal diameter: no end chamfer is drawn (the catalogue gives none)", "Which end is tapped (the figure shows the left end; the text does not say)", "The orientation of the second flat of WSC / WFC (turned 90 degrees)", "The orientation of the second wrench flat set SX (turned 90 degrees)", "The diameter tolerance of the step P (g7 is printed but no limits are given): the step is drawn at its nominal diameter", "The datum of FC / WFC / LFC / SC positions on a stepped shaft (taken from the shoulder of the main body, as in the figures)", "Chamfers at the shaft ends (drawn in the p.436 figure but not dimensioned)", "WSC is read as the alternative to SC on the both-ends-tapped wrench-flat type"]
