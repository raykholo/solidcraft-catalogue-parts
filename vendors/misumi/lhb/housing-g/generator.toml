id = "misumi.lhb.housing-g"
name = "MISUMI Economy linear bushing housing units, center hole height optional: single (E-LBHG) and double (E-LBHGW)"
version = "0.1.0"
kind = "generator"
min_host_version = "0.49.1"
preview_code = "E-LBHGW20-25"

[entry]
build  = "housing:parse_build"
check  = "check:check"
shots  = "shots"

[declares]
labels   = ["Linear bushing housing unit, center hole height optional", "Pillow block bushing housing", "E-LBHG", "E-LBHGW"]
keywords = ["linear bushing housing", "housing unit", "flanged linear bushing housing", "linear ball bushing housing", "pillow block linear", "linear shaft block"]
vendor   = "MISUMI"

[[declares.matches]]
id         = "lhb-housing-g"
generator  = "housing-g"
pattern    = '^E-LBHG(?:W)?(?P<dr>\d{1,2})-(?P<h>\d{1,2})$'
flags      = "i"
confidence = "exact"
params     = { shaft_diameter_mm = "{dr}", center_height_mm = "{h}" }
examples          = ["E-LBHG12-15", "E-LBHG30-50", "E-LBHGW20-25", "E-LBHGW16-30"]
negative_examples = ["E-LBHG", "E-LBHG12", "E-LBHGW-25", "E-LBHG12-15-P", "E-LBHG12X", "E-LBHS16", "E-LBHN16"]

[inputs]
type = { choices = ["E-LBHG", "E-LBHGW"] }
shaft_diameter_mm = { choices = [12, 16, 20, 25, 30] }
center_height_mm = { choices = [15, 20, 25, 30, 40, 50] }

[guarantee]
not_guaranteed = ["The built-in linear bushing is not drawn: the bore is an empty plain cylinder at the nominal shaft diameter dr (the catalogue gives no inner dimensions of the unit)", "Upper corner chamfers (appearance, approximate): the figure shows the body top cut at both upper corners; the printed C1 is read as the 45 degree chamfer size. The shape of the two 4-C / 2-C chamfers of the figures (flange edges, the (0.5) of column C) is not drawn", "The flange is drawn as a plain rectangular plate of width L (symmetric, thickness S): the figure's flange outline and the position of the datum surface edges are read from the drawing, with no further dimensions printed", "Mounting holes: 4-d are drawn as plain through holes in the flange on L1 x T1 (no counterbore is printed)", "Total height H1 = H + offset is printed with the tolerance 0 / -0.5 and the centre height H with +-0.05; both are echoed in the description, not drawn", "Load ratings, allowable static moments and masses are not modelled"]
