format = "solidcraft-generator/2"
id = "tall-housing"
name = "MISUMI Economy linear bushing housing units, tall blocks with dowel holes (E-LBHS, E-LBHSW)"
license = "CC0-1.0"
model = "tall-housing.sc"

[parameters]
dr = { type = "text", min = 1, max = 2, escape = "[0-9]" }
raw = { type = "text", min = 1, max = 128, escape = "[ -~]" }
dowel = { type = "int", min = 0, max = 1 }

# Ordering code: E-LBHS[W]<dr>[D|S|L][-P]. The second template takes any other text so that generator.rhai can refuse it with the shape message.
[[template]]
pattern = 'E\-LBHS[W:double]{dr}[{length: D|S|L}][\-P:dowel]'

[[template]]
pattern = '{raw}'

