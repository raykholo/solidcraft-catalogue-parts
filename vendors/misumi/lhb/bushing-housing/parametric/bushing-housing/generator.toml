format = "solidcraft-generator/2"
id = "bushing-housing"
name = "MISUMI Economy linear bushing housing units, wide blocks (E-LBHN, E-LBHNW), with or without dowel holes"
license = "CC0-1.0"
model = "bushing-housing.sc"

[parameters]
dowel = { type = "int", min = 0, max = 1 }

# Ordering code: E-LBHN[W]<dr>[D|L][-P]. The second template takes any other text so that generator.rhai can refuse it with the shape message.
[[template]]
pattern = 'E\-LBHN[W:double]{dr: text 1..2 [0-9]}[{length: D|L}][\-P:dowel]'

[[template]]
pattern = '{raw: text 1..128 [ -~]}'

