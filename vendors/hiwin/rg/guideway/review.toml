[[row]]
id = 1608
verdict = "corrected"
note = "P (30,30,30,40,40,52.5,60,75) and Es (20,20,20,20,20,22.5,30,35) agree with Table 2-9-29 p.165, and the standard-length examples reproduce L=(n-1)P+2E with E=Es for every size (e.g. RGR15 160 (5): 4x30+40; RGR65 1270 (17): 16x75+70). Rule corrected: the page text says only 'E no greater than 1/2 the pitch' for non-standard lengths; the author's bound min(Es,P/2) <= E <= max(Es,P/2) also admitted 15 < E < 20 for RGR15/20/25, which the text forbids. Now: E = Es exactly (standard length) or E <= P/2, smallest E = min(Es, P/2) (not printed; family convention). Old: upper bound max(Es,P/2) -> new: P/2 plus the standard Es. Code RGR25R995 (E=17.5) was therefore replaced by RGR25R990 (E=15) in codes.txt and 995 added as a refusal."

