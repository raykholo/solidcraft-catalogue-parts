item = "Rail standard pitch P (30, 30, 30, 40, 40, 52.5, 60, 75), distance to end Es (20, 20, 20, 20, 20, 22.5, 30, 35), L = (n-1)P + 2E, E no greater than P/2 for non-standard lengths"
value = ""
source = ["S17"]
source_text = "S17 p.165 Table 2-9-29 and 2-9-12 text"
page = "p.165 Table 2-9-29"
status = "published"
note = "published; the text of 2-9-12 says E no greater than P/2 for non-standard lengths; Table 2-9-29 prints no smallest E. For RGR15 / 20 / 25 the printed standard Es = 20 is larger than P/2 = 15 (the standard lengths 160, 220, 340 ... all use E = 20), so a standard length (E = Es exactly) is accepted and any other length needs E <= P/2. Smallest E (not printed): Es, or P/2 when Es > P/2 (family convention). Corrected in the independent review: the earlier rule also accepted 15 < E < 20."

