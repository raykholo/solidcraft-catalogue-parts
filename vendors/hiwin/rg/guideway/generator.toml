id = "hiwin.rg.guideway"
name = "HIWIN RG high-rigidity roller type linear guideway: rail, block or rail with blocks"
version = "0.2.3"
kind = "generator"
min_host_version = "0.49.1"
preview_code = "RGW25CC2R640ZAP"

[entry]
build  = "build:parse_build"
check  = "check:check"
shots  = "shots"

[declares]
labels   = ["Linear guideway", "Linear rail", "RG rail", "RG block", "RGH", "RGW", "RGR", "Roller type guideway"]
keywords = ["roller type linear guide", "high rigidity guideway", "flange block", "carriage"]
vendor   = "HIWIN"

[[declares.matches]]
id         = "rg-set"
generator  = "guideway"
pattern    = '^RG(?P<kind>[HW])\s*(?P<size>15|20|25|30|35|45|55|65)\s*(?P<load>[CH])\s*(?P<mount>[AC])\s*E?\s*(?P<blocks>\d+)\s*(?P<rm>[RT])\s*(?P<length>\d+(?:\.\d+)?)'
flags      = "i"
confidence = "exact"
params     = { series = "RG{kind}", size = "{size}", load = "{load}", mount = "{mount}", blocks = "{blocks}", length_mm = "{length}" }
examples          = ["RGH20CA2R1000ZAH", "RGW25CC1R640ZAP", "RGH65HA1R1270"]
negative_examples = ["RGH20CA", "RGR15R160", "RGH20CA2", "RG20"]

[[declares.matches]]
id         = "rg-block"
generator  = "guideway"
pattern    = '^RG(?P<kind>[HW])\s*(?P<size>15|20|25|30|35|45|55|65)\s*(?P<load>[CH])\s*(?P<mount>[AC])\s*E?\s*(?:Z0|ZA)?\s*(?:[HP])?\s*(?:\+.*)?$'
flags      = "i"
confidence = "exact"
params     = { series = "RG{kind}", size = "{size}", load = "{load}", mount = "{mount}" }
examples          = ["RGW45CC", "RGH20CA", "RGW25CCZAP", "RGW25CCEZAP+ZZ"]
negative_examples = ["RGH20CA2R1000ZAH", "RGR15R160", "RGH20", "RGW45"]

[[declares.matches]]
id         = "rg-rail"
generator  = "guideway"
pattern    = '^RGR\s*(?P<size>15|20|25|30|35|45|55|65)\s*(?P<rm>[RT])\s*(?P<length>\d+(?:\.\d+)?)'
flags      = "i"
confidence = "exact"
params     = { size = "{size}", length_mm = "{length}" }
examples          = ["RGR15R160", "RGR25R640", "RGR65R1270"]
negative_examples = ["RGR15", "RGH20CA", "RGR99R100"]

[inputs]
series = { choices = ["RGH", "RGW", "RGR"] }
size = { choices = ["15", "20", "25", "30", "35", "45", "55", "65"] }
load = { choices = ["C", "H"] }
mount = { choices = ["A", "C"] }
length_mm = { min = 100, max = 4000 }

[guarantee]
not_guaranteed = ["The whole body shape: rails and blocks are the catalogue envelopes (WR x HR rail; W x L1 x (H - H1) steel block body with the rail channel cut out, end caps and seals to the length L); the roller tracks and the flange outline are not published as dimensions", "RGW mounting holes are tapped to the depth T (T and T1 are printed without a definition; the mounting code C means top or bottom, so the real holes may run through the flange), and the two rail-axis holes of both block types (legend 6-Mxl / 6-M) take the same thread depth as the flank holes", "The 10 mm gap between neighbouring blocks (illustration)", "Rail top chamfers and the two side roller tracks (circular approximations), block top chamfers, the end cap / end seal split of (L - L1) / 2 with its 0.5 mm inset and black plastic, and the brass grease nipple (appearance bodies and features named (appearance, approximate))", "Rail screws: SolidCraft's ISO 4762 standard part of the catalogue bolt size", "Materials and PBR looks of every body (ground top and raceway faces, satin body, plastics, brass, black oxide): SolidCraft appearance-library entries, black oxide with its own pbr", "Self-lubricant (E2) and reinforced cap (RC) options after + (parsed, not drawn), accuracy, preload and special E blocks / rails (recorded in the code only)"]
