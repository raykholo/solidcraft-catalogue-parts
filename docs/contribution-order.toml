# The order in which the generators are offered to the official repository, one pull request each (tools/split reads this file;
# docs/contributing-upstream.md is the procedure). The first three were fixed by the maintainer; the other fifteen are ordered by
# the evidence below, strongest first.
#
# Evidence weighed (counted from each generator's sources.toml, review.toml, codes.txt and checks/ at the time of writing; all 18 are
# Reviewed, independent AI re-read, 2026-11-26 / 27, none by a person):
#   corrections    rows the independent re-read marked "corrected" (the review found a real error and it was fixed)
#   codes          valid codes + codes that must be rejected, in codes.txt
#   rows/code      spec-check rows per built code in the newest checks/ folder (0.50.0)
#   cited          share of sources.toml dimension rows that are published / labelled / measured / derived (not approximate or none)
#   printed        share of those that are printed in the catalogue (published / labelled) rather than measured / derived
# Appearance-only rows are the complement of "cited". More corrections, more codes, more check rows and a higher cited share rank
# higher; a large share of derived or "none" rows ranks lower (a reviewer has more to take on trust).
#
# grammar (optional) names the section of docs/grammar.md that goes in with the generator.

[[generator]]
id = "misumi.hnt.t-nut"
reason = "Fixed first: the smallest complete generator (10 rows, 5 valid + 3 rejected codes, 14 checks per code, 90% cited); every value was re-read from the catalogue page and the side view re-measured from its vector paths, so it is quick to review and shows the whole method."
grammar = "MISUMI 5 series pre-assembly T-nuts (S9)"

[[generator]]
id = "misumi.hfs.extrusion"
reason = "Fixed second: the most dimensioned generator (67 rows, 97% cited, 30 published and 24 labelled), 1 correction found in review, 22 codes, 28 checks per code."
grammar = "MISUMI 5 and 6 series aluminium extrusion"

